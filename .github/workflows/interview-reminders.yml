name: Interview reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder sweep
        env:
          INTERVIEW_REMINDER_URL: ${{ vars.INTERVIEW_REMINDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$INTERVIEW_REMINDER_URL" ]]; then
            echo "::error::Set the INTERVIEW_REMINDER_URL Actions variable to the deployed reminder endpoint."
            exit 1
          fi
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Set the CRON_SECRET Actions secret to match the server environment."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$INTERVIEW_REMINDER_URL"
